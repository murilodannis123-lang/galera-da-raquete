<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--roxo:#1d5c36;--roxo2:#123d24;--verde:#1f3266;--ouro:#d4ae5a;--bg:#f4f2f8;--card:#fff;--txt:#1e1830;--mut:#6c6680;--lin:#e3dff0;--erro:#c0392b;--ok:#146142;--vez:#fff4c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:linear-gradient(160deg,var(--roxo),var(--roxo2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 16px;text-align:center;position:relative}
.marca{display:flex;align-items:center;justify-content:center;gap:10px}
.marca img{width:44px;height:44px}
.marca h1{margin:0;font-size:17px;letter-spacing:.06em;line-height:1.15;text-align:left}
.marca h1 small{display:block;font-size:11px;font-weight:600;opacity:.8;letter-spacing:.12em}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px}
.vivo{opacity:.85}
.vivo i{display:inline-block;width:7px;height:7px;border-radius:9px;background:#9a9;margin-right:4px}
.vivo.on i{background:#5df08f}
.quem{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}
header{background:linear-gradient(100deg,#0f3a22 0%,#1d5c36 44%,#1f3266 56%,#121f45 100%);border-bottom:3px solid var(--ouro)}
.logo-t{background:#fff;border-radius:12px;width:86px;height:62px;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.3);border:2px solid var(--ouro)}
.logo-t img{width:100%;height:100%;object-fit:contain;display:block}
.medalha{width:96px;height:96px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.duelo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px;gap:6px}
.lado-d{display:flex;flex-direction:column;align-items:center;min-width:0}
.duelo .t{font-size:13px;font-weight:800;margin-top:7px;text-transform:uppercase;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duelo .n{font-size:50px;font-weight:900;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.vs-old{font-size:20px;font-weight:900;font-style:italic;background:#d8f05a;color:#1e1830;border-radius:10px;padding:6px 8px;transform:skew(-8deg);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.lider{font-size:12px;margin-top:6px;opacity:.85}
main{padding:12px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--lin);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:11px;color:var(--mut);font-weight:600}
nav button b{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--roxo)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,20,80,.08)}
.card.vez{background:var(--vez);box-shadow:0 0 0 2px #e0b400}
h2{font-size:15px;margin:4px 0 10px}
h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;background:var(--lin);color:var(--txt);text-decoration:none;display:inline-block}
.btn.p{background:var(--roxo);color:#fff}
.btn.v{background:var(--verde);color:#fff}
.btn.w{background:#25d366;color:#fff}
.btn.r{background:var(--erro);color:#fff}
.btn.s{padding:6px 9px;font-size:12px}
.btn:disabled{opacity:.4}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--lin);color:var(--mut);white-space:nowrap}
.badge.lib{background:#e6f4ec;color:var(--ok)}
.badge.fim{background:var(--roxo);color:#fff}
.badge.vz{background:#e0b400;color:#1e1830}
.conf-h{display:flex;align-items:center;gap:8px;cursor:pointer}
.conf-h .tt{font-weight:800;font-size:15px}
.conf-h .pl{font-weight:800;font-variant-numeric:tabular-nums}
.jogo{border-top:1px solid var(--lin);padding:10px 0 4px}
.jogo.atual{background:var(--vez);margin:0 -12px;padding:10px 12px 6px}
.jogo .lb{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.lados{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lado .tn{font-size:11px;font-weight:700;color:var(--roxo);margin-bottom:3px}
.lado.b .tn{color:var(--verde)}
.nomej{font-size:14px;padding:5px 0;min-height:30px}
.esp{color:var(--mut);font-style:italic;font-size:13px}
select,input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--lin);border-radius:9px;padding:8px;background:#fff;color:var(--txt)}
select{margin-bottom:5px}
select.ex{border-color:#e0b400;background:#fffbe6}
select.bad{border-color:var(--erro);background:#fdeeee}
textarea{min-height:110px}
.res{display:flex;gap:6px;align-items:center;margin-top:6px}
.res input{flex:1}
.wbtn{border:2px solid var(--lin);background:#fff;border-radius:9px;padding:7px 10px;font-weight:800;font-size:12px;color:var(--mut)}
.wbtn.on.a{border-color:var(--roxo);background:var(--roxo);color:#fff}
.wbtn.on.b{border-color:var(--verde);background:var(--verde);color:#fff}
.erro{color:var(--erro);font-size:12px;margin-top:6px}
.dica{color:var(--mut);font-size:12px;margin:6px 0}
.lin{display:flex;align-items:center;gap:6px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--lin)}
.lin:last-child{border:0}
.lin .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin input{flex:1;padding:6px}
.ct{font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.ct.ok{color:var(--ok)}
.estrela{border:0;background:none;font-size:18px;padding:2px 4px;filter:grayscale(1);opacity:.35}
.estrela.on{filter:none;opacity:1}
.x{border:0;background:none;color:var(--mut);font-size:16px;padding:2px 6px}
.x.conf{color:#fff;background:var(--erro);border-radius:7px;font-size:12px;font-weight:700}
.seg{display:flex;background:var(--lin);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--roxo)}
.mini{font-size:13px;padding:5px 0;display:flex;gap:6px;align-items:baseline}
.mini .q{color:var(--mut);font-size:12px;min-width:62px}
.mini .w{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;background:var(--bg);border-radius:99px;padding:4px 9px}
.vazio{color:var(--mut);font-size:13px;text-align:center;padding:16px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1e1830;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:9;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hide{display:none}
.picker{margin-top:8px;border-top:1px dashed #d9c27a;padding-top:8px}
.chips-j{display:flex;flex-wrap:wrap;gap:6px}
.chip-j{border:2px solid transparent;border-radius:11px;padding:7px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip-j small{font-size:10px;font-weight:700;opacity:.75}
.chip-j.verde{background:#1f8a4c;color:#fff}
.chip-j.meio{background:#d9f2e2;color:#145c33;border-color:#8fd3a8}
.chip-j.ouro{border-color:#c9a03a;box-shadow:0 0 0 1px #f3d77e inset}
.chip-j.verde.ouro{background:linear-gradient(135deg,#1f8a4c 55%,#c9a03a)}
.chip-j.extra{background:linear-gradient(135deg,#f6dd8a,#c9a03a);color:#3a2a00;border-color:#a8801f}
.chip-j.off{background:#eceaf0;color:#a9a4b5;text-decoration:line-through;cursor:default;border-color:transparent;box-shadow:none}
.chip-j:active:not(:disabled){transform:scale(.96)}
.pill{display:inline-flex;align-items:center;gap:6px;background:#1e1830;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;margin-bottom:5px}
.pill.ouro{background:linear-gradient(135deg,#c9a03a,#8a6a14)}
.tira{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:7px;font-size:12px;padding:2px 6px}
.lg{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:2px}
.lg.verde{background:#1f8a4c;color:#fff}.lg.meio{background:#d9f2e2;color:#145c33}.lg.ouro{background:#f0d27a;color:#3a2a00}.lg.off{background:#eceaf0;color:#a9a4b5;text-decoration:line-through}
.lin-ouro .nm{color:#8a6a14;font-weight:800}
.estrela.conf{filter:none;opacity:1;font-size:12px;font-weight:800;background:#f0d27a;border-radius:8px;padding:4px 8px;color:#3a2a00}
span.estrela{display:inline-block;width:26px;text-align:center}
.aviso-ouro{background:#fff4c2;border:1px solid #e0b400;border-radius:9px;padding:8px;font-size:12px;margin:8px 0}
.intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 42%,#26304f 0%,#0b0f1d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;transition:opacity .45s;cursor:pointer}
.intro.sai{opacity:0;pointer-events:none}
.arena{position:relative;width:min(62vw,290px);aspect-ratio:1}
.medal-i{position:absolute;inset:0;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6));animation:treme .4s linear .78s both}
.metade{position:absolute;inset:0;background:center/contain no-repeat}
.metade.l{clip-path:inset(0 48.6% 0 0);animation:entraL .55s cubic-bezier(.45,0,.95,.55) .25s both}
.metade.r{clip-path:inset(0 0 0 51.4%);animation:entraR .55s cubic-bezier(.45,0,.95,.55) .25s both}
@keyframes entraL{from{transform:translateX(-95vw) rotate(-28deg)}to{transform:none}}
@keyframes entraR{from{transform:translateX(95vw) rotate(28deg)}to{transform:none}}
@keyframes treme{0%,100%{transform:none}15%{transform:translate(-10px,4px) scale(1.07)}35%{transform:translate(9px,-5px) scale(1.04)}55%{transform:translate(-6px,3px)}75%{transform:translate(3px,-2px)}}
.flash{position:absolute;left:50%;top:50%;width:140%;height:140%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0%,rgba(255,236,170,.85) 22%,rgba(255,236,170,0) 60%);opacity:0;animation:flash .6s ease-out .8s both;pointer-events:none}
@keyframes flash{0%{opacity:0}2%{opacity:1}100%{opacity:0}}
.anel{position:absolute;left:50%;top:50%;width:30px;height:30px;border:5px solid var(--ouro);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:anel .8s ease-out .8s both}
@keyframes anel{0%{opacity:0;width:30px;height:30px}2%{opacity:1;width:30px;height:30px}100%{opacity:0;width:190vmax;height:190vmax;border-width:1px}}
.faisca{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 8px #ffd25a;opacity:0;animation:faisca .7s ease-out .8s both}
@keyframes faisca{0%{opacity:0;transform:translate(0,0)}2%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.duelo-i{margin-top:24px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:clamp(13px,3.8vw,18px);letter-spacing:.05em}
.eq-i{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(36vw,150px);white-space:nowrap}
.ea{animation:vemL .45s cubic-bezier(.2,.8,.3,1.2) 1.05s both}.eb{animation:vemR .45s cubic-bezier(.2,.8,.3,1.2) 1.05s both}
.duelo-i .xx{animation:sobe .4s ease-out 1.2s both}
.card-i{background:#fff;border-radius:14px;width:100%;height:calc(min(36vw,150px)*.78);display:flex;align-items:center;justify-content:center;padding:6px;border:3px solid var(--ouro);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.card-i img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes vemL{from{opacity:0;transform:translateX(-40px) scale(.8)}to{opacity:1;transform:none}}
@keyframes vemR{from{opacity:0;transform:translateX(40px) scale(.8)}to{opacity:1;transform:none}}
.duelo-i .fa{color:#5fd08a}.duelo-i .fb{color:#8fb0ff}.duelo-i .xx{color:var(--ouro);font-size:1.3em}
.sub-i{margin-top:8px;font-size:12px;letter-spacing:.2em;opacity:.75;animation:sobe .5s ease-out 1.25s both}
.toque{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:12px;opacity:0;animation:pisca 1.4s ease-in-out 2s infinite}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pisca{0%,100%{opacity:.25}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.intro *{animation-duration:.01s!important;animation-delay:0s!important}}
.grande{font-size:15px;line-height:1.4}
</style>
</head>

<script>
(function(){
"use strict";
/* Supabase do grupo — a tabela copa_davis é separada do ranking */
var SB_URL="https://ekiihkdxbrwrvtnsbens.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVraWloa2R4YnJ3cnZ0bnNiZW5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NzI4MzMsImV4cCI6MjEwODU0ODgzM30.VWhSU-3toh822U_XKq8sIEdUmaebtZ8ENL_Flif1DgQ";

var KEY="copa-davis-galera-v2", KPIN="copa-davis-pin";
var TIPOS=[{t:"S",lb:"Simples 1",n:1},{t:"D",lb:"Duplas",n:2},{t:"S",lb:"Simples 2",n:1}];
var NCONF=10, MAX_NORMAL=2, MAX_EXTRA=2, MAX_CORINGAS=2;

function novo(){
  var conf=[];
  for(var i=0;i<NCONF;i++) conf.push({m:TIPOS.map(function(x){return {t:x.t,lb:x.lb,A:new Array(x.n).fill(null),B:new Array(x.n).fill(null),placar:"",win:null};})});
  return {v:2,nomes:{A:"Floresta",B:"Portal do Lago"},jog:[],conf:conf,seq:1,ord:0,estrito:true,sorteio:null};
}
function valido(o){return o&&o.v===2&&o.conf&&o.jog}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
var S=(function(){try{var o=JSON.parse(lsGet(KEY));if(valido(o))return o}catch(e){}return novo()})();

var ui={tab:"placar",aberto:null,timeJog:"A",excluir:null,editando:null,login:false};
var net={sb:null,versao:-1,on:false,salvando:false,pendente:false,papel:null,pin:lsGet(KPIN)};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2600)}
function jog(id){for(var i=0;i<S.jog.length;i++) if(S.jog[i].id===id) return S.jog[i]; return null}
function nome(sl){if(!sl) return "—"; var j=jog(sl.id); return (j?j.name:"?")+(sl.x?" ⭐":"")}
function time(t){return S.nomes[t]}
function outro(t){return t==="A"?"B":"A"}
function adm(){return net.papel==="admin"}
function cap(){return net.papel==="A"||net.papel==="B"?net.papel:null}
function pode(){return !!net.papel}

/* ---------- contagem ---------- */
function cada(fn){S.conf.forEach(function(c,ci){c.m.forEach(function(m,mi){["A","B"].forEach(function(t){m[t].forEach(function(sl,pi){ if(sl) fn(sl,ci,mi,t,pi,m); });});});});}
function stats(id,ig){
  var r={S:0,D:0,X:0,jogou:0,venceu:0};
  cada(function(sl,ci,mi,t,pi,m){
    if(sl.id!==id) return;
    if(ig&&ig.ci===ci&&ig.mi===mi&&ig.t===t&&ig.pi===pi) return;
    if(sl.x) r.X++; else r[m.t]++;
    if(m.win){r.jogou++; if(m.win===t) r.venceu++;}
  });
  r.N=r.S+r.D; return r;
}
function pontos(){var p={A:0,B:0};S.conf.forEach(function(c){c.m.forEach(function(m){if(m.win)p[m.win]++})});return p}
function confPts(c){var p={A:0,B:0,fim:0};c.m.forEach(function(m){if(m.win){p[m.win]++;p.fim++}});return p}

/* ---------- vez de quem ---------- */
function cheio(m,t){return m[t].every(Boolean)}
function partida(k){return S.conf[Math.floor(k/3)].m[k%3]}
function primeiro(k){return S.sorteio?(k%2===0?S.sorteio:outro(S.sorteio)):null}
function atual(){for(var k=0;k<NCONF*3;k++){var m=partida(k);if(!cheio(m,"A")||!cheio(m,"B"))return k}return -1}
function vez(){var k=atual();if(k<0||!S.sorteio)return null;var f=primeiro(k);return cheio(partida(k),f)?outro(f):f}
function ultimaDoOutro(t){var o=-1;cada(function(sl,ci,mi,tt){if(tt!==t&&sl.o>o)o=sl.o});return o}
function podeSlot(ci,mi,t,pi){
  var m=S.conf[ci].m[mi], sl=m[t][pi];
  if(adm()) return !m.win;
  if(cap()!==t||m.win||!S.sorteio) return false;
  if(!sl) return ci*3+mi===atual()&&vez()===t;
  return (sl.o||0)>ultimaDoOutro(t);
}

/* ---------- validação ---------- */
function erroSlot(ci,mi,t,pi,sl){
  if(!sl) return "";
  var j=jog(sl.id), m=S.conf[ci].m[mi];
  if(!j) return "Jogador excluído";
  if(j.team!==t) return j.name+" não é do "+time(t);
  if(j.reserva) return j.name+" está na reserva";
  for(var k=0;k<m[t].length;k++) if(k!==pi&&m[t][k]&&m[t][k].id===sl.id) return j.name+" está duas vezes na mesma partida";
  var s=stats(sl.id,{ci:ci,mi:mi,t:t,pi:pi});
  if(sl.x){
    if(!j.joker) return j.name+" não é coringa";
    if(s.X>=MAX_EXTRA) return j.name+" já usou as "+MAX_EXTRA+" entradas extras";
  }else{
    if(s.N>=MAX_NORMAL) return j.name+" já tem "+MAX_NORMAL+" partidas normais";
    if(S.estrito&&s[m.t]>=1) return j.name+" já tem partida de "+(m.t==="S"?"simples":"duplas");
  }
  return "";
}

/* ---------- escolha automática ---------- */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function naConf(c,id){var r=false;c.m.forEach(function(m){["A","B"].forEach(function(t){m[t].forEach(function(sl){if(sl&&sl.id===id)r=true})})});return r}
function sugerir(ci,mi,t,pi){
  var c=S.conf[ci];
  var cand=shuffle(S.jog.filter(function(j){return j.team===t&&!j.reserva})).map(function(j){return {j:j,s:stats(j.id),d:naConf(c,j.id)}})
    .filter(function(o){return !erroSlot(ci,mi,t,pi,{id:o.j.id,x:false})});
  cand.sort(function(a,b){return (a.d-b.d)||(a.s.N-b.s.N)});
  return cand.length?cand[0].j.id:null;
}
function repetidos(){var n=0;S.conf.forEach(function(c){var v={};c.m.forEach(function(m){["A","B"].forEach(function(t){m[t].forEach(function(sl){if(!sl)return;if(v[sl.id])n++;v[sl.id]=1})})})});return n}
function autoTudo(){
  var base=JSON.stringify(S.conf), ord0=S.ord, melhor=null;
  for(var r=0;r<60;r++){
    S.conf=JSON.parse(base); S.ord=ord0; var f=0;
    ["S","D"].forEach(function(tp){S.conf.forEach(function(c,ci){c.m.forEach(function(m,mi){ if(m.t!==tp) return;
      ["A","B"].forEach(function(t){m[t].forEach(function(sl,pi){ if(sl) return;
        var id=sugerir(ci,mi,t,pi); if(id) m[t][pi]={id:id,x:false,o:++S.ord}; else f++;
      })});
    })})});
    var rp=repetidos();
    if(!melhor||f<melhor.f||(f===melhor.f&&rp<melhor.r)) melhor={f:f,r:rp,c:JSON.stringify(S.conf),o:S.ord};
    if(!f&&!rp) break;
  }
  S.conf=JSON.parse(melhor.c); S.ord=melhor.o; return melhor.f;
}

/* ---------- ações ---------- */
var LIVRE={tab:1,abrir:1,timeJog:1,login:1,entrar:1,sair:1,backup:1,mostrarBk:1};
function act(a,d){
  var m;
  if(!LIVRE[a]&&!pode()){toast("Entre com o PIN para alterar");return;}
  var soAdm={autoTudo:1,limparConf:1,estrito:1,reserva:1,editar:1,del:1,addJog:1,restaurar:1,zerar:1,resorteio:1};
  if(soAdm[a]&&!adm()){toast("Só o organizador faz isso");return;}
  switch(a){
    case "tab": ui.tab=d.v; ui.login=false; window.scrollTo(0,0); render(); return;
    case "abrir": ui.aberto=(ui.aberto===+d.c?-1:+d.c); render(); return;
    case "login": ui.login=!ui.login; render(); if(ui.login) setTimeout(function(){var p=$("pin");p&&p.focus()},50); return;
    case "entrar": entrar($("pin").value.trim()); return;
    case "sair": net.papel=null; net.pin=null; lsSet(KPIN,null); ui.login=false; toast("Saiu"); render(); return;
    case "timeJog": ui.timeJog=d.t; ui.excluir=null; render(); return;
    case "sorteio":
      if(S.sorteio){toast("Sorteio já feito");return;}
      S.sorteio=Math.random()<.5?"A":"B"; toast("🎲 "+time(S.sorteio)+" escolhe primeiro"); break;
    case "resorteio":
      if(S.ord){toast("Já tem jogador escalado");return;}
      S.sorteio=null; break;
    case "pegar":
      var kp=atual(); if(kp<0) return; var tp=jog(d.id).team;
      if(!adm()&&cap()!==tp){toast("Só o capitão do "+time(tp));return;}
      if(vez()!==tp){toast("Não é a vez do "+time(tp));return;}
      var cip=Math.floor(kp/3), mip=kp%3, mp=partida(kp), pp=-1;
      for(var q=0;q<mp[tp].length;q++) if(!mp[tp][q]&&podeSlot(cip,mip,tp,q)){pp=q;break}
      if(pp<0) return;
      var sn={id:d.id,x:false,o:++S.ord};
      if(erroSlot(cip,mip,tp,pp,sn)){ sn.x=true; var ex=erroSlot(cip,mip,tp,pp,sn); if(ex){toast(ex);return;} toast("⭐ "+jog(d.id).name+" entra como coringa (extra)"); }
      mp[tp][pp]=sn; break;
    case "tirar":
      if(!podeSlot(+d.c,+d.m,d.t,+d.p)){toast("Não dá pra mudar agora");return;}
      S.conf[d.c].m[d.m][d.t][+d.p]=null; break;
    case "sugestao":
      var k=atual(); if(k<0) return; var t=cap()||vez(); if(vez()!==t){toast("Não é a vez do "+time(t));return;}
      var ci=Math.floor(k/3), mi=k%3; m=partida(k); var n=0;
      m[t].forEach(function(sl,pi){ if(sl) return; var id=sugerir(ci,mi,t,pi); if(id){m[t][pi]={id:id,x:false,o:++S.ord};n++;} });
      if(!n){toast("Nenhum jogador disponível");return;} break;
    case "autoTudo":
      if(!S.sorteio) S.sorteio=Math.random()<.5?"A":"B";
      var f=autoTudo(); toast(f?f+" vaga(s) sem jogador disponível":"Escalação completa"); break;
    case "limparConf":
      S.conf[d.c].m.forEach(function(mm){if(mm.win)return;mm.A=mm.A.map(function(){return null});mm.B=mm.B.map(function(){return null})}); break;
    case "win":
      m=S.conf[d.c].m[d.m]; if(!cheio(m,"A")||!cheio(m,"B")){toast("Escalação incompleta");return;}
      m.win=(m.win===d.t?null:d.t); break;
    case "estrito": S.estrito=!S.estrito; break;
    case "coringa":
      var j=jog(d.id);
      if(!adm()&&cap()!==j.team){toast("Só o capitão do "+time(j.team)+" escolhe os coringas");return;}
      if(j.joker){
        if(!adm()){toast("Coringa definido não pode ser trocado");return;}
        if(stats(j.id).X){toast(j.name+" já usou entrada extra");return;}
        j.joker=false; break;
      }
      if(S.jog.filter(function(x){return x.team===j.team&&x.joker}).length>=MAX_CORINGAS){toast("O "+time(j.team)+" já tem os "+MAX_CORINGAS+" coringas");return;}
      if(ui.excluir!=="C"+j.id){ui.excluir="C"+j.id;render();toast("Toque de novo para confirmar. Não dá pra trocar depois.");return;}
      ui.excluir=null; j.joker=true; toast("⭐ "+j.name+" é coringa do "+time(j.team)); break;
    case "reserva":
      var jr=jog(d.id), sr=stats(jr.id);
      if(!jr.reserva&&(sr.N||sr.X)){toast(jr.name+" já está escalado");return;}
      if(!jr.reserva&&jr.joker){toast("Coringa não vai pra reserva");return;}
      jr.reserva=!jr.reserva; toast(jr.reserva?jr.name+" foi pra reserva":jr.name+" entrou no time"); break;
    case "editar": ui.editando=d.id; render(); return;
    case "del":
      if(ui.excluir!==d.id){ui.excluir=d.id;render();return;}
      var usado=false; S.conf.forEach(function(c){c.m.forEach(function(mm){if(mm.win)["A","B"].forEach(function(t){mm[t].forEach(function(sl){if(sl&&sl.id===d.id)usado=true})})})});
      if(usado){toast("Jogador já tem resultado lançado");ui.excluir=null;render();return;}
      S.conf.forEach(function(c){c.m.forEach(function(mm){["A","B"].forEach(function(t){mm[t]=mm[t].map(function(sl){return sl&&sl.id===d.id?null:sl})})})});
      S.jog=S.jog.filter(function(x){return x.id!==d.id}); ui.excluir=null; break;
    case "addJog":
      var nomes=$("novos").value.split(/\n|;/).map(function(s){return s.trim()}).filter(Boolean);
      if(!nomes.length) return;
      nomes.forEach(function(n){S.jog.push({id:"j"+(S.seq++),name:n,team:ui.timeJog,joker:false})});
      toast(nomes.length+" jogador(es) adicionados"); break;
    case "backup": var b=$("bk"); b.value=JSON.stringify(S); b.classList.remove("hide"); b.select();
      try{navigator.clipboard.writeText(b.value).then(function(){toast("Backup copiado")},function(){})}catch(e){} return;
    case "mostrarBk": var k2=$("bk"); k2.value=""; k2.classList.remove("hide"); $("btRest").classList.remove("hide"); k2.focus(); return;
    case "restaurar":
      try{var o=JSON.parse($("bk").value); if(!valido(o)) throw 0; S=o; toast("Backup restaurado");}catch(e){toast("Backup inválido");return;}
      break;
    case "zerar":
      if(ui.excluir!=="ZERAR"){ui.excluir="ZERAR";render();return;}
      S=novo(); ui.excluir=null; toast("Campeonato zerado"); break;
    default: return;
  }
  save(); render();
}
function setSlot(ci,mi,t,pi,v){
  if(!podeSlot(ci,mi,t,pi)){toast("Não é sua vez");render();return;}
  var m=S.conf[ci].m[mi];
  if(!v) m[t][pi]=null;
  else { var p=v.split("|"), sl={id:p[0],x:p[1]==="x",o:++S.ord}; var e=erroSlot(ci,mi,t,pi,sl); if(e){toast(e);render();return;} m[t][pi]=sl; }
  save(); render();
}

/* ---------- rede ---------- */
function cache(){lsSet(KEY,JSON.stringify(S))}
function status(){var v=$("vivo");v.classList.toggle("on",net.on);v.innerHTML="<i></i>"+(net.sb?(net.on?"ao vivo":"reconectando…"):"sem conexão")}
function aplicar(row,forca){
  if(!row) return;
  if(!forca&&(row.versao<=net.versao||net.salvando||net.pendente)) return;
  net.versao=row.versao;
  S=valido(row.estado)?row.estado:novo(); cache(); render();
}
function baixar(forca){
  if(!net.sb) return Promise.resolve();
  return net.sb.from("copa_davis").select("estado,versao").eq("id",1).single().then(function(r){
    if(r.error){net.on=false;status();return;}
    net.on=true; status(); aplicar(r.data,forca);
  },function(){net.on=false;status();});
}
function save(){
  cache();
  if(!net.sb||!net.pin){return;}
  net.pendente=true; enviar();
}
function enviar(){
  if(net.salvando||!net.pendente) return;
  net.salvando=true; net.pendente=false;
  net.sb.rpc("copa_salvar",{p_pin:net.pin,p_estado:S,p_versao:net.versao}).then(function(r){
    net.salvando=false;
    if(r.error){
      net.pendente=false;
      toast(/CONFLITO/.test(r.error.message)?"O outro capitão mexeu ao mesmo tempo. Tela atualizada, faça de novo.":"Não salvou: "+r.error.message);
      baixar(true); return;
    }
    net.versao=r.data; if(net.pendente) enviar();
  },function(){net.salvando=false;net.pendente=false;toast("Sem internet: não salvou");baixar(true);});
}
function entrar(pin){
  if(!pin) return;
  if(!net.sb){toast("Sem conexão");return;}
  net.sb.rpc("copa_papel",{p_pin:pin}).then(function(r){
    if(r.error||!r.data){toast("PIN inválido");return;}
    net.pin=pin; net.papel=r.data; lsSet(KPIN,pin); ui.login=false;
    toast(r.data==="admin"?"Entrou como organizador":"Entrou como capitão do "+time(r.data));
    if(r.data!=="admin") ui.tab="confrontos";
    render();
  },function(){toast("Sem conexão");});
}
function iniciar(){
  if(!window.supabase||SB_URL.indexOf("http")!==0){status();return;}
  net.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  status();
  baixar(true).then(function(){
    if(net.pin) net.sb.rpc("copa_papel",{p_pin:net.pin}).then(function(r){ if(r.data){net.papel=r.data;render();} else {net.pin=null;lsSet(KPIN,null);} });
  });
  net.sb.channel("copa-davis").on("postgres_changes",{event:"UPDATE",schema:"public",table:"copa_davis"},function(p){aplicar(p.new,false)})
    .subscribe(function(st){ if(st==="SUBSCRIBED"){net.on=true;status();} });
  setInterval(function(){baixar(false)},15000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)baixar(false)});
}

function opcoes(ci,mi,t,pi,sl){

function chip(ci,mi,t,j){
  var s=stats(j.id), pi=-1, m=S.conf[ci].m[mi];
  for(var i=0;i<m[t].length;i++) if(!m[t][i]){pi=i;break}
  var okN=pi>=0&&!erroSlot(ci,mi,t,pi,{id:j.id,x:false}), okX=pi>=0&&j.joker&&!erroSlot(ci,mi,t,pi,{id:j.id,x:true});
  var cl=okN?(s.N===0?"verde":"meio"):okX?"extra":"off";
  var info=okN||!j.joker?s.N+"/2":"extra "+s.X+"/2";
  if(j.joker&&okN&&s.X) info+=" · X"+s.X;
  return '<button class="chip-j '+cl+(j.joker?" ouro":"")+'"'+(okN||okX?' data-a="pegar" data-id="'+j.id+'"':' disabled')+'>'+(j.joker?"⭐ ":"")+esc(j.name)+'<small>'+info+'</small></button>';
}

function vJogadores(){
  var t=ui.timeJog, A=adm(), todos=S.jog.filter(function(j){return j.team===t}).sort(function(a,b){return a.name.localeCompare(b.name)});
  var lista=todos.filter(function(j){return !j.reserva}), res=todos.filter(function(j){return j.reserva});
  var cor=lista.filter(function(j){return j.joker}).length;
  var h='<div class="seg"><button data-a="timeJog" data-t="A" class="'+(t==="A"?"on":"")+'">'+esc(time("A"))+'</button><button data-a="timeJog" data-t="B" class="'+(t==="B"?"on":"")+'">'+esc(time("B"))+'</button></div>';
  if(A) h+='<div class="card"><div class="dica" style="margin-top:0">Nome do time</div><input type="text" data-nometime="'+t+'" value="'+esc(time(t))+'"></div>';
  h+='<div class="card"><div class="row"><h2 class="sp" style="margin:0">'+lista.length+'/20 jogadores</h2><span class="ct">⭐ '+cor+'/'+MAX_CORINGAS+' coringas</span></div>';
  if(cap()===t&&cor<MAX_CORINGAS) h+='<div class="aviso-ouro">Capitão: toque na ⭐ para escolher os '+MAX_CORINGAS+' coringas do '+esc(time(t))+'. Depois de confirmado, não dá pra trocar.</div>';
  if(!lista.length) h+='<div class="vazio">Nenhum jogador ainda.</div>';
  lista.forEach(function(j){
    var s=stats(j.id);
    var podeC=A||(cap()===t&&!j.joker&&cor<MAX_CORINGAS);
    var conf=ui.excluir==="C"+j.id;
    h+='<div class="lin'+(j.joker?" lin-ouro":"")+'">'+(podeC?'<button class="estrela'+(j.joker?" on":"")+(conf?" conf":"")+'" data-a="coringa" data-id="'+j.id+'">'+(conf?"Confirmar ⭐":"⭐")+'</button>':(j.joker?'<span class="estrela on">⭐</span>':'<span class="estrela"></span>'));
    if(A&&ui.editando===j.id) h+='<input type="text" data-nome="'+j.id+'" value="'+esc(j.name)+'">';
    else h+='<span class="nm"'+(A?' data-a="editar" data-id="'+j.id+'"':'')+'>'+esc(j.name)+'</span>';
    h+='<span class="ct'+(s.N>=2?" ok":"")+'">S'+s.S+' D'+s.D+(j.joker?' X'+s.X:'')+'</span>';
    if(A&&!s.N&&!s.X&&!j.joker) h+='<button class="btn s" data-a="reserva" data-id="'+j.id+'">Reserva</button>';
    if(A) h+='<button class="x'+(ui.excluir===j.id?" conf":"")+'" data-a="del" data-id="'+j.id+'">'+(ui.excluir===j.id?"Excluir?":"✕")+'</button>';
    h+='</div>';
  });
  if(res.length){
    h+='<h3>Reserva (fora da escalação)</h3>';
    res.forEach(function(j){ h+='<div class="lin"><span class="estrela"></span><span class="nm" style="color:var(--mut)">'+esc(j.name)+'</span>'+(A?'<button class="btn s v" data-a="reserva" data-id="'+j.id+'">Ativar</button>':'<span class="ct">reserva</span>')+'</div>'; });
  }
  h+='<div class="dica">S/D = simples/duplas escaladas · X = entradas extras do coringa'+(A?' · toque no nome para editar · ⭐ marca coringa':'')+'</div></div>';
  if(A) h+='<div class="card"><h2>Adicionar ao '+esc(time(t))+'</h2><textarea id="novos" placeholder="Um nome por linha (pode colar a lista inteira)"></textarea><div class="row" style="margin-top:8px"><span class="sp"></span><button class="btn p" data-a="addJog">Adicionar</button></div></div>';
  return h;
}
function vRelatorio(){
  var h="";
  ["A","B"].forEach(function(t){
    var l=S.jog.filter(function(j){return j.team===t&&!j.reserva}).sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(j){return {j:j,s:stats(j.id)}});
    var g=function(f){var x=l.filter(f);return x.length?'<div class="chips">'+x.map(function(o){return '<span class="chip">'+esc(o.j.name)+'</span>'}).join("")+'</div>':'<div class="dica">—</div>'};
    h+='<div class="card"><h2>'+esc(time(t))+'</h2><h3>Partidas por jogador</h3>';
    l.forEach(function(o){h+='<div class="lin"><span class="nm">'+(o.j.joker?"⭐ ":"")+esc(o.j.name)+'</span><span class="ct">escalado '+o.s.N+'/2'+(o.j.joker?' · extra '+o.s.X+'/2':'')+' · jogou '+o.s.jogou+' · venceu '+o.s.venceu+'</span></div>'});
    if(!l.length) h+='<div class="dica">Sem jogadores.</div>';
    h+='<h3>Ainda não escalados</h3>'+g(function(o){return o.s.N===0})+'<h3>Só 1 partida</h3>'+g(function(o){return o.s.N===1})+'<h3>Completaram as 2</h3>'+g(function(o){return o.s.N>=2})+'</div>';
  });
  h+='<div class="card"><h2>Histórico de resultados</h2>'; var n=0;
  S.conf.forEach(function(c,ci){c.m.forEach(function(m){ if(!m.win) return; n++;
    h+='<div class="mini"><span class="q">C'+(ci+1)+' '+m.lb+'</span><span>'+esc(m.A.map(nome).join("/"))+' × '+esc(m.B.map(nome).join("/"))+(m.placar?' <b>'+esc(m.placar)+'</b>':'')+' <span class="w">✅ '+esc(time(m.win))+'</span></span></div>';
  })});
  if(!n) h+='<div class="dica">Nenhum resultado ainda.</div>';
  h+='</div>';
  if(adm()) h+='<div class="card"><h2>Backup</h2><div class="dica">Tudo fica salvo online. Se quiser uma cópia, copie e guarde no seu WhatsApp.</div>'+
    '<textarea id="bk" class="hide" placeholder="Cole aqui um backup para restaurar"></textarea>'+
    '<div class="row wrap" style="margin-top:8px"><button class="btn p s" data-a="backup">Copiar backup</button><button class="btn s" data-a="mostrarBk">Restaurar</button><button class="btn s hide" id="btRest" data-a="restaurar">Confirmar restauração</button><span class="sp"></span>'+
    '<button class="btn s'+(ui.excluir==="ZERAR"?" r":"")+'" data-a="zerar">'+(ui.excluir==="ZERAR"?"Confirmar: zerar tudo":"Zerar campeonato")+'</button></div></div>';
  return h;
}

function render(){
  var p=pontos();
  $("hA").textContent=time("A"); $("hB").textContent=time("B");

  $("pA").textContent=p.A; $("pB").textContent=p.B;
  var jg=p.A+p.B;
  $("lider").textContent=(p.A>=16||p.B>=16)?"🏆 "+time(p.A>=16?"A":"B")+" campeão!"+(jg<30?" · "+(30-jg)+" partida(s) restantes":""):jg?(p.A===p.B?"Empate":"Vantagem "+time(p.A>p.B?"A":"B"))+" · "+(30-jg)+" partida(s) restantes":"30 partidas · 10 confrontos";
  $("quem").textContent=net.papel?(adm()?"👑 Organizador":"🎾 Capitão "+time(net.papel)):"🔑 Entrar";
  var foco=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.placar;
  if(foco) return;
  var y=window.scrollY;
  $("app").innerHTML=vLogin()+{placar:vPlacar,confrontos:vConfrontos,jogadores:vJogadores,relatorio:vRelatorio}[ui.tab]();
  window.scrollTo(0,y);
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===ui.tab)});
  var ed=document.querySelector("[data-nome]"); if(ed){ed.focus();ed.select();}
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var n=e.target.closest("nav button"); if(n){act("tab",{v:n.dataset.tab});return;}
  var b=e.target.closest("[data-a]"); if(!b||b.tagName==="SELECT"||b.type==="checkbox"||b.tagName==="A") return;
  if(b.dataset.a!=="del"&&b.dataset.a!=="zerar"&&b.dataset.a!=="coringa") ui.excluir=null;
  act(b.dataset.a,b.dataset);
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.slot){var p=t.dataset.slot.split(",");setSlot(+p[0],+p[1],p[2],+p[3],t.value);return;}
  if(t.dataset.placar){ if(!pode()) return; var q=t.dataset.placar.split(",");S.conf[+q[0]].m[+q[1]].placar=t.value.trim();save();return;}
  if(t.dataset.a==="estrito"){act("estrito",{});return;}
  if(t.dataset.nometime&&adm()){var v=t.value.trim();if(v){S.nomes[t.dataset.nometime]=v;save();render();}return;}
});
document.addEventListener("focusout",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.placar){setTimeout(render,0);return;}
  if(!t.dataset||!t.dataset.nome) return;
  var j=jog(t.dataset.nome), v=t.value.trim(); if(j&&v&&v!==j.name){j.name=v;save();}
  ui.editando=null; setTimeout(render,0);
});
document.addEventListener("keydown",function(e){
  var d=e.target.dataset||{};
  if(e.key==="Enter"){ if(e.target.id==="pin") act("entrar",{}); else if(d.nome||d.placar) e.target.blur(); }
});
(function(){
  var it=$("intro"), ar=it.querySelector(".arena");
  it.querySelectorAll(".metade").forEach(function(m){m.style.backgroundImage="url("+$("medalha").src+")"});
  for(var i=0;i<14;i++){var f=document.createElement("i");f.className="faisca";var a=Math.random()*6.283,d=90+Math.random()*120;
    f.style.setProperty("--x",Math.cos(a)*d+"px");f.style.setProperty("--y",Math.sin(a)*d+"px");f.style.animationDelay=(.78+Math.random()*.08)+"s";ar.appendChild(f);}
  var fechar=function(){if(it.classList.contains("sai"))return;it.classList.add("sai");setTimeout(function(){it.remove()},500)};
  it.addEventListener("click",fechar); setTimeout(fechar,3600);
})();
render(); status(); iniciar();
})();
</script>
</body>
